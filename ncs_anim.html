<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Red Themed Animista‑Style Animations</title>

    <style>
        /* COMMON STYLES */
        body {
            color: white;
            background: #111;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            flex-direction: column;
            gap: 40px;
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        h1{
            text-align: center;
        }
        .logo {
            width: 140px;
            filter: drop-shadow(0 0 8px #f00);
        }

        .card {
            text-align: center;
            color: #f00;
        }

        .card h3 {
            margin-top: 10px;
            font-size: 16px;
        }

        /* ANIMATION 1 – Fade In */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.6);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .anim1 {
            animation: fadeIn 1s ease forwards;
        }

        /* ANIMATION 2 – Slide In From Top */
        @keyframes slideInTop {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .anim2 {
            animation: slideInTop 1s ease forwards;
        }

        /* ANIMATION 3 – Scale Bounce */
        @keyframes bounceScale {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }

        .anim3 {
            animation: bounceScale 1.2s ease-in-out infinite;
        }

        /* ANIMATION 4 – Rotate Flip */
        @keyframes rotateFlip {
            0% {
                transform: rotateY(0);
            }

            100% {
                transform: rotateY(360deg);
            }
        }

        .anim4 {
            animation: rotateFlip 1.8s linear infinite;
        }

        /* ANIMATION 5 – Pulse Glow Red */
        @keyframes pulseRed {
            0% {
                filter: drop-shadow(0 0 8px #f00);
            }

            50% {
                filter: drop-shadow(0 0 20px #ff4d4d);
            }

            100% {
                filter: drop-shadow(0 0 8px #f00);
            }
        }

        .anim5 {
            animation: pulseRed 1.5s ease-in-out infinite;
        }

        /* ANIMATION 6 – Skew Slant */
        @keyframes skewSlant {
            0% {
                transform: skew(0deg);
            }

            50% {
                transform: skew(12deg);
            }

            100% {
                transform: skew(0deg);
            }
        }

        .anim6 {
            animation: skewSlant 2s ease-in-out infinite;
        }

        /* ANIMATION 7 – Slide Left */
        @keyframes slideLeft {
            from {
                transform: translateX(50px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .anim7 {
            animation: slideLeft 1s ease forwards;
        }

        /* ANIMATION 8 – Zoom In */
        @keyframes zoomIn {
            from {
                transform: scale(0.3);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .anim8 {
            animation: zoomIn 1.4s ease forwards;
        }

        /* ANIMATION 9 – Wiggle */
        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(0);
            }

            25% {
                transform: rotate(-10deg);
            }

            50% {
                transform: rotate(10deg);
            }

            75% {
                transform: rotate(-6deg);
            }
        }

        .anim9 {
            animation: wiggle 1s ease-in-out infinite;
        }

        /* ANIMATION 10 – Flicker */
        @keyframes flicker {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        .anim10 {
            animation: flicker 0.9s step-end infinite;
        }
    </style>
</head>

<body>
    <h1>Refresh the page</h1>
    <div class="card">
        <img src="NCS.png" class="logo anim1" alt="NCS Logo">
        <h3>Fade In</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim2" alt="NCS Logo">
        <h3>Slide In Top</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim3" alt="NCS Logo">
        <h3>Bounce Scale</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim4" alt="NCS Logo">
        <h3>Rotate Flip</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim5" alt="NCS Logo">
        <h3>Pulse Glow</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim6" alt="NCS Logo">
        <h3>Skew Slant</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim7" alt="NCS Logo">
        <h3>Slide Left</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim8" alt="NCS Logo">
        <h3>Zoom In</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim9" alt="NCS Logo">
        <h3>Wiggle</h3>
    </div>

    <div class="card">
        <img src="NCS.png" class="logo anim10" alt="NCS Logo">
        <h3>Flicker</h3>
    </div>

</body>

</html>
