<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="shortcut icon" href="NCS.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            background-color: rgba(0, 0, 0, 0.717);
        }

        .box {
            width: 10rem;
            height: 10rem;
            border: 0.5px solid black;
            box-shadow: 0 0 10px rgb(90, 0, 0);
        }

        .box1 {
            background-color: rgb(21, 0, 255);
            position: relative;
            top: 5rem;
            left: 5rem;
        }

        .box2 {
            background-color: green;
            position: relative;
            left: 10rem;
        }

        .box3 {
            background-color: yellow;
            position: relative;
            bottom: 5rem;
            left: 15rem;
        }

        .box4 {
            background-color: black;
            position: relative;
            bottom: 10rem;
            left: 20rem;
        }

        .box5 {
            background-color: red;
            position: relative;
            bottom: 20rem;
            left: 5rem;
        }

        .box6 {
            background-color: gold;
            position: relative;
            bottom: 45rem;
            left: 20rem;
        }
    </style>
</head>

<body>

    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
    <div class="box box6"></div>

</body>

</html>
