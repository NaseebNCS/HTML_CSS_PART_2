<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-size: cover;
            background-position: center;
            animation: change-bg 10s linear 1s infinite alternate;
        }
        @keyframes change-bg {
            0% {
                background-image: url(bg1.jpg);
            }

            25% {
                background-image: url(bg2.jpg);
            }

            50% {
                background-image: url(bg3.jpg);
            }

            75% {
                background-image: url(bg4.jpg);
            }

            100% {
                background-image: url(bg1.jpg);
            }
        }
        h1 {
            font-size: 4rem;
            color: white;
            background-color: rgba(0, 0, 0, 0.387);
            padding: 1rem 7rem;
            border-radius: 1rem;
        }
        h1::after{
            animation: change-text 10s linear 1s infinite alternate;
            content: " Developer";
        }

        @keyframes change-text {
            0%{
                 content: " Developer";
            }
            25%{
                 content: " FrontEnd Developer";
            }
            50%{
                 content: " BackEnd Developer";
            }
            75%{
                 content: " Full Stack Developer";
            }
            100%{
                 content:  " Programmer";
            }
        }
    </style>
</head>

<body>
    <h1>I'm a</h1>
</body>


</html>
