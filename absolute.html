<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" href="NCS.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        html{
            font-size: 62.5%;
        }
        body{
            background-color: rgba(0, 0, 0, 0.717);
        }
        .container{
            border: 5px solid red;
            width: 50vw;
            margin: auto;
            position: relative;
            height: 500px;
        }

        .box{
            width: 10rem;
            height: 10rem;
        }
        .box1{
            background-color: rgb(21, 0, 255);
            position: absolute;
            right: 0;
            bottom: 0;
           
        }
        .box2{
            /* left: calc(90vw - 10rem - 10px); */
            background-color: green;
            position: absolute;
            right: 0;
            top: 0;
        
        }
        .box3{
            background-color: yellow;
             position: absolute;
             bottom: 0;
        }
        .box4{
            background-color: black;
             position: absolute;
        }

        .box5{
            background-color: red;
            position: absolute;
            top: calc(50% - 5rem);
            left: calc(50% - 5rem); 
        }
    </style>
</head>
<body>
    <!-- .container>.box.box$*4 -->
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
    </div>

</body>
</html>
