<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #010101;
        }
        .box{
            transform: rotateY(180deg);
            width: 143px;
            height:65px;
            background-image: url(super-car.gif);
            background-size: cover;

            animation: racing 3s linear 2s forwards;
        }

        .box:nth-child(1){
            animation-timing-function: ease;
        }
        .box:nth-child(2){
            animation-timing-function: ease-in;
        }
        .box:nth-child(3){
            animation-timing-function: ease-out;
        }
        .box:nth-child(4){
            animation-timing-function: ease-in-out;
        }
        .box:nth-child(5){
            animation-timing-function: linear;
        }
        .box:nth-child(6){
            animation-timing-function: step-end;
        }
        .box:nth-child(7){
            animation-timing-function: step-start;
        }
        .box:nth-child(8){
            animation-timing-function: cubic-bezier(1,1.02,1,-0.23);
        }
        .box:nth-child(9){
            animation-timing-function: cubic-bezier(1,-0.03,.66,.06);
        }


        @keyframes racing {
            0%{
                transform: rotateY(180deg) translateX(0);
            }
            100%{
                transform:rotateY(180deg) translateX(-1000px);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>
</html>
